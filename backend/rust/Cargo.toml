[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono"
] }

thiserror = "1"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"
